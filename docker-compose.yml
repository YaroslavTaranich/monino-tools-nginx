services:
  reverse-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme.sh:/etc/acme.sh
    networks:
      - app-network

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: letsencrypt
    depends_on:
      - reverse-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme.sh:/etc/acme.sh
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      VIRTUAL_HOST: pgadmin.moninotools.ru
      VIRTUAL_PORT: 80
      VIRTUAL_PROTO: http
      HTTPS_REDIRECT: false
      HTTPS_METHOD: noredirect
      LETSENCRYPT_HOST: pgadmin.moninotools.ru
      LETSENCRYPT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
    - "5050:80" 
    depends_on:
      - postgres
    networks:
      - app-network

  api:
    image: monino-tools-api:${APP_VERSION:-latest}
    build: ./api
    environment:
      VIRTUAL_HOST: api.moninotools.ru
      VIRTUAL_PORT: 3000
      VIRTUAL_PROTO: http
      HTTPS_REDIRECT: false
      HTTPS_METHOD: noredirect
      LETSENCRYPT_HOST: api.moninotools.ru
      LETSENCRYPT_EMAIL: ${ADMIN_EMAIL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: https://admin.moninotools.ru,https://moninotools.ru
      PORT: "3000"
    volumes:
      - static-data:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health', (response) => process.exit(response.statusCode >= 200 && response.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  admin:
    image: monino-tools-admin:${APP_VERSION:-latest}
    build:
      context: ./admin
      args:
        REACT_APP_API_URL: https://api.moninotools.ru
    environment:
      VIRTUAL_PROTO: http
      HTTPS_REDIRECT: false
      HTTPS_METHOD: noredirect
      VIRTUAL_PORT: 80
      VIRTUAL_HOST: admin.moninotools.ru
      LETSENCRYPT_HOST: admin.moninotools.ru
      LETSENCRYPT_EMAIL: ${ADMIN_EMAIL}
      REACT_APP_API_URL: https://api.moninotools.ru
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      reverse-proxy:
        condition: service_started
      letsencrypt:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  user:
    image: monino-tools-user:${APP_VERSION:-latest}
    build:
      context: ./user
      args:
        NEXT_PUBLIC_API_URL: https://api.moninotools.ru/
    environment:
      VIRTUAL_PROTO: http
      HTTPS_REDIRECT: false
      HTTPS_METHOD: noredirect
      VIRTUAL_HOST: moninotools.ru
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: moninotools.ru
      LETSENCRYPT_EMAIL: ${ADMIN_EMAIL}
      NEXT_PUBLIC_API_URL: https://api.moninotools.ru/
      TELEGRAM_BOT: ${TELEGRAM_BOT}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000', (response) => process.exit(response.statusCode >= 200 && response.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      reverse-proxy:
        condition: service_started
      letsencrypt:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  static-data:
